<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <span class="popup-title">🌐 GitHub Translate</span>
    </div>

    <div class="popup-body">
      <div class="toggle-row">
        <span class="toggle-label">启用翻译</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggleEnabled" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="status-row" id="statusRow">
        <span class="status-text" id="statusText">检测中...</span>
      </div>

      <button class="btn-retranslate" id="btnRetranslate">
        重新翻译当前页面
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
